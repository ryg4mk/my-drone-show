<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#080c14"><meta name="description" content="PNG・JPG・GIFを最大3素材まで組み合わせて、光のドローンショーを作成。画像は端末内だけで処理します。"><title>マイドローンショー</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1><span aria-hidden="true">✦</span> マイドローンショー</h1></header>
<main>
  <section class="image-control" aria-labelledby="uploadHeading"><h2 id="uploadHeading">1. 素材を選ぶ（PNG・JPG・GIFを最大3個）</h2>
    <label class="file-picker" for="imageInput"><span class="file-button">画像を選択</span><span id="fileName" class="file-name">サンプルを読み込み中</span><input id="imageInput" type="file" multiple aria-label="画像を選択（PNG・JPG・GIFを最大3個）" accept="image/png,image/jpeg,image/gif,.png,.jpg,.jpeg,.gif"></label>
    <ol id="selectedImages" class="selected-images" aria-label="選択した画像と再生順" hidden></ol>
  </section>
  <details id="selectionPanel"><summary>2. 範囲を選ぶ（静止画のみ・任意）</summary>
    <p id="selectionHelp" class="help">必要な場合だけ、表示する範囲を選べます。選ばなければ画像全体を使います。</p>
    <div id="imageTabs" class="image-tabs" role="group" aria-label="範囲を選ぶ素材"><button data-slot="0" class="active">素材1</button><button data-slot="1" hidden>素材2</button><button data-slot="2" hidden>素材3</button></div>
    <div id="editorStage" class="editor-stage"><canvas id="editor" aria-label="画像の四角形範囲選択" aria-describedby="selectionHelp"></canvas></div>
    <div class="selection-actions"><p class="help">ドラッグで選択。四隅でサイズ変更、内側で移動。</p><button id="reselect" class="secondary" disabled>画像全体を使う</button></div>
  </details>
  <div class="show-controls"><div class="count-control"><label class="control-label" for="droneCount">3. 機数を選ぶ</label><select id="droneCount"><option value="0">自動</option><option value="1000">1000機</option><option value="1500">1500機</option><option value="2000">2000機</option></select></div><div class="mode-control"><span class="control-label">4. 表示モード</span><div class="mode-switch" role="group" aria-label="表示モード"><button id="nightMode" class="active" aria-pressed="true">夜空</button><button id="arMode" aria-pressed="false">AR</button></div></div><div class="play-control"><h2>5. ショーを見る</h2><button id="start" class="primary" disabled>スタート</button></div></div>
  <section class="stage" id="stage" aria-label="ドローンショー"><video id="camera" autoplay muted playsinline></video><canvas id="show" aria-label="ドローンショーの光点"></canvas></section>
  <p id="stateLabel" class="state" role="status" aria-live="polite">サンプルを読み込み中</p><p id="message" class="message" role="status" aria-live="polite"></p>
  <p class="help privacy">画像は端末内だけで処理されます。</p>
</main><footer><span>マイドローンショー</span><span>登録不要 · 画像のアップロードなし</span><span id="visitCount" class="visit-count" hidden></span></footer><script type="module" src="app.js"></script><script type="module" src="counter.mjs"></script></body></html>
